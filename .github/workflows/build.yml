name: Build, test and publish

# Every Plone version a site runs gets an image, tagged with that version:
#   ghcr.io/pretagov/plone-backend-layer:6.2.2
# Pull requests build and test; main also publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plone-version: ["6.2.1", "6.2.2"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plone
          POSTGRES_PASSWORD: plone
          POSTGRES_DB: zodb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plone" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --build-arg PLONE_VERSION=${{ matrix.plone-version }} -t layer:test .

      - name: Test
        run: bash tests/test.sh layer:test "host=127.0.0.1 port=5432 dbname=zodb user=plone password=plone"

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag layer:test ghcr.io/pretagov/plone-backend-layer:${{ matrix.plone-version }}
          docker push ghcr.io/pretagov/plone-backend-layer:${{ matrix.plone-version }}
